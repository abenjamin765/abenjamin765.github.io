  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var hdr = document.querySelector(".hdr");
      function onScroll() {
        if (hdr) hdr.classList.toggle("hdr--scrolled", window.scrollY > 8);
      }
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    });
