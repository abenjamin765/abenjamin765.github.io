<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagram connector regression fixture</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#faf9f5;color:#333;font:16px/1.5 Arial,sans-serif}.diagram{max-width:1000px;margin:auto;padding:40px 24px;border:1px solid #ddd;border-radius:12px;background:#efeee8}.source{position:relative;width:fit-content;margin:0 auto 36px;padding:12px 20px;border:1px solid #aaa;border-radius:8px;background:white}.source::after{content:"";position:absolute;left:calc(50% - .5px);bottom:-19px;width:1px;height:19px;background:#999}.cards{--gap:16px;position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}.cards::before{content:"";position:absolute;left:calc((100% - 2 * var(--gap)) / 6 - .5px);right:calc((100% - 2 * var(--gap)) / 6 - .5px);top:-18px;height:1px;background:#999}.card{position:relative;min-width:0;padding:16px;border-radius:8px;background:white}.card::before{content:"";position:absolute;bottom:calc(100% - 1px);left:calc(50% - .5px);height:19px;width:1px;background:#999}.context{margin:0 0 16px;text-align:center;font-size:12px}.card h2{font-size:18px;margin:0 0 12px}.card p{overflow-wrap:break-word}.broken .cards::before{left:16.66%;right:16.66%}.broken .context{text-align:left}
@media(max-width:900px){.cards{grid-template-columns:1fr;gap:20px}.source::after,.cards::before,.card::before{display:none}}
</style></head><body><main><figure class="diagram"><div class="source">Product / MUG-01</div><div class="cards"><div class="card"><p class="context">Shopper / discover</p><h2>Product Card</h2><p>Find the product and add it to a cart.</p></div><div class="card"><p class="context">Merchant / maintain</p><h2>Catalog Row</h2><p>Edit the product and review availability.</p></div><div class="card"><p class="context">Shopper / review</p><h2>Cart Summary</h2><p>Review quantity and the line total.</p></div></div></figure></main></body></html>
